[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "melco-nav-emu"
version = "0.0.1"
description = "QEMU-based emulator for the Volvo RTI MMM+ (CU-P2006) head unit, booting the retail 2017-18 EU DVD"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "melco-nav-emu contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
melco-nav-emu = "melco_nav_emu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
